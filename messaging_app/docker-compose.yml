version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: messaging_db
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_USER: messaging_user
      MYSQL_PASSWORD: securepassword123
      MYSQL_DB: messaging_db
      MYSQL_ROOT_PASSWORD: rootpassword123

  web:
    build: .
    container_name: messaging_web
    command: ["./wait-for-it.sh", "db:3306", "-t", "60", "--", "python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file: .env

volumes:
  db_data:
